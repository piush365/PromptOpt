<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PromptOpt rewrites vague prompts into clear, structured prompts for GPT, Gemini and Claude, and measures whether it helps." />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/svg+xml" href="/static/ui/favicon.svg" />
    <title>PromptOpt</title>
    <script>
      // Apply the saved theme before the first paint (no flash).
      try {
        var t = localStorage.getItem("po-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      /* App shell: painted before the JavaScript arrives, replaced by React on first render. */
      #shell { min-height: 100dvh; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; background: #f6f7f9; color: #141a26; font-family: "IBM Plex Sans", system-ui, sans-serif; }
      .dark #shell { background: #0d1219; color: #e7ebf1; }
      #shell header { box-sizing: border-box; height: 56px; border-bottom: 1px solid #dde2ea; display: flex; align-items: center; padding: 0 16px; gap: 10px; font-weight: 700; font-size: 20px; }
      .dark #shell header { border-color: #253041; }
      #shell .dots { display: inline-flex; gap: 3px; background: #141a26; border-radius: 8px; padding: 8px 6px; }
      #shell .dots i { width: 8px; height: 8px; border-radius: 99px; display: block; }
      #shell main { padding: 24px 16px; max-width: 90rem; }
      #shell h1 { font-family: "Bricolage Grotesque Variable", system-ui, sans-serif; font-weight: 600; font-size: 1.875rem; line-height: 2.25rem; letter-spacing: -0.02em; margin: 0; }
      #shell p { color: #3a4456; font-size: 1.0625rem; line-height: 1.6; margin: 8px 0 0; max-width: 48rem; }
      .dark #shell p { color: #c3cad6; }
      @media (min-width: 1024px) { #shell { padding-left: 15rem; } #shell main { padding: 32px; } #shell h1 { font-size: 2.5rem; line-height: 1.15; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="shell" aria-busy="true">
      <header><span class="dots" aria-hidden="true"><i style="background:#5b8def"></i><i style="background:#2fb383"></i><i style="background:#e9a23b"></i></span>PromptOpt</header>
      <main><h1 id="shell-title">Make a vague prompt clear and short.</h1><p id="shell-lead">Write it the way you normally would. PromptOpt shows what's missing, fixes it step by step, and writes it out for your model.</p></main>
    </div></div>
    <script>
      (function () {
        // Same title and lead as the page React renders next, so the first paint already shows the page.
        var t = {
          "/compare": ["Compare", "Send your prompt and the optimized one to the same model and see what each costs and returns. This is the real test of whether optimizing helped."],
          "/suite": ["Test suite", "50 realistic cases written with a known right answer: a vague prompt as a student would type it, and the material it's about. Each prompt was answered as is and after optimizing, then checked against the gold answer."],
          "/results": ["Results", "The final numbers, read live from evaluation/FINAL_RESULTS.md. Val was used for tuning; the test split was run once at the end, with Stage A and B frozen."],
          "/how": ["How it works", "Your prompt goes through four steps. Rules do almost all the work; a small model helps only when they can't. Click a step to see what it does, with a real example."],
          "/history": ["History", "Kept for 30 days, then deleted. Emails and phone numbers are removed before anything is stored."],
          "/image": ["Image mode", "For image generators. Your words stay first and nothing is added that could change your picture; missing details become suggestions you can click."],
          "/status": ["Status & settings", "What this server can do right now, and how to turn on what's missing."]
        }[location.pathname];
        if (t) { document.getElementById("shell-title").textContent = t[0]; document.getElementById("shell-lead").textContent = t[1]; }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
